name: 功能建议
description: 想加一个规则、字段或交互
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个项目刻意保持小：纯前端、零后端、不做投资建议。
        提之前可以先看一眼 [决策记录](https://github.com/fanpaisk/jiancang/blob/main/docs/DECISIONS.md)，很多方向已经明确否过。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先描述场景，不要直接跳到实现
      placeholder: 例如：截图里没有代码，每次都要手填，很麻烦
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你建议怎么做
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
  - type: checkboxes
    id: scope
    attributes:
      label: 边界确认
      options:
        - label: 这个功能可以在纯前端、零后端下完成
        - label: 它不包含投资建议、自动交易或收益预测
